# Browser CRD — the DECLARED GOAL of the platform.
#
# Before this, the control service told Kubernetes "create this Pod" by hand
# (imperative). After this, a caller just declares "I want a Browser", and the
# operator (see operator/controller.py) keeps reality matching that goal:
# it creates the browser Pod, fills in status, and cleans up when deleted.
#
# This is the platform-engineering pattern: declare desired state, reconcile.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: browsers.browsermesh.dev
spec:
  group: browsermesh.dev
  scope: Namespaced
  names:
    kind: Browser
    plural: browsers
    singular: browser
    shortNames:
      - br
  versions:
    - name: v1
      served: true
      storage: true
      # Lets the operator update .status without ever touching .spec.
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # The engine/provider image to run. Today only "cloak" exists;
                # future engines (chromium, firefox, ...) are added as images.
                type:
                  type: string
                  default: "cloak"
              required:
                - type
            status:
              type: object
              properties:
                phase:
                  type: string # Pending | Running | Failed
                podIP:
                  type: string
                cdpUrl:
                  type: string
                vncUrl:
                  type: string
              # Keep unknown fields so the operator can grow status freely.
              x-kubernetes-preserve-unknown-fields: true
