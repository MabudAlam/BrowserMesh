# Cloud Build: build the browser image, push to GCR, deploy to Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml .
#
# Only the browser container is built here (infra/browser). The control plane,
# operator, and CRD are Kubernetes-only — see deploy/cloudrun.md.
#
# One-time IAM for the Cloud Build service account (PROJECT_NUMBER@cloudbuild):
#   roles/storage.admin          (push to gcr.io; use Artifact Registry Writer if _REGISTRY is AR)
#   roles/run.admin              (deploy the Cloud Run service)
#   roles/iam.serviceAccountUser (act as the Cloud Run runtime service account)

substitutions:
  _SERVICE: browsermesh-browser
  _REGION: us-central1
  # gcr.io still works; Artifact Registry is preferred for new projects:
  #   _REGISTRY: us-central1-docker.pkg.dev
  #   _REPO_IMAGE: browsermesh/browser-pod
  _REGISTRY: gcr.io
  _REPO_IMAGE: browsermesh-browser

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/browser/Dockerfile
      - -t
      - ${_REGISTRY}/$PROJECT_ID/${_REPO_IMAGE}:$BUILD_ID
      - -t
      - ${_REGISTRY}/$PROJECT_ID/${_REPO_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/$PROJECT_ID/${_REPO_IMAGE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGISTRY}/$PROJECT_ID/${_REPO_IMAGE}:$BUILD_ID
      - --region=${_REGION}
      - --port=8080
      - --cpu=1
      - --memory=2Gi
      # Watchable single-use mode: one instance, shared by the SDK's CDP
      # connection and your viewer (open https://<service>/watch). For isolated
      # one-browser-per-connection instead, use --concurrency=1 --max-instances=5
      # (but then a viewer gets its own browser, not the one a script drives).
      - --concurrency=10
      - --min-instances=0
      - --max-instances=1
      - --timeout=3600
      - --no-cpu-throttling
      - --session-affinity
      # ponytail: open by default so the noVNC page and CDP work without tokens.
      # Switch to --no-allow-unauthenticated for anything non-test.
      - --allow-unauthenticated

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
