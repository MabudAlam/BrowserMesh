# Single-port gateway for the browser container.
#
# Cloud Run exposes exactly one port ($PORT), but a browser needs two internal
# servers: KasmVNC (noVNC page + /websockify) on 6080 and Chrome's CDP on 9223.
# This fronts both on one port so the same image runs on Cloud Run (standalone)
# and in k8s (where the control-plane gateway talks to 9223/6080 directly and
# this proxy is simply not started).
#
# Routes:
#   /json, /devtools  -> 127.0.0.1:9223  (CDP version JSON + browser WS)
#   /                 -> 127.0.0.1:6080  (KasmVNC: noVNC page + /websockify WS)
#   /healthz          -> 200
#
# ponytail: healthz is always 200 (nginx is up before Chrome); clients retry
# until CDP answers. Gate it on the CDP socket only if startup races appear.

daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;

    # Writable temp paths so nginx can run as a non-root user.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        # CDP discovery: rewrite Chrome's loopback ws URL to the public host so
        # clients can connect straight to wss://<host>/devtools/browser/<id>.
        # Pin the upstream Host to the loopback so Chrome always reports
        # ws://127.0.0.1:9222 (its Host validation also requires IP/localhost).
        location /json {
            proxy_pass http://127.0.0.1:9223;
            proxy_set_header Host 127.0.0.1:9222;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter 'ws://localhost:9222' 'wss://$host';
            sub_filter 'ws://127.0.0.1:9222' 'wss://$host';
        }

        # CDP browser websocket.
        location /devtools {
            proxy_pass http://127.0.0.1:9223;
            proxy_set_header Host 127.0.0.1:9222;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # KasmVNC: serves the noVNC page at / and the RFB websocket at /websockify.
        location / {
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
